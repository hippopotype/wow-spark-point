name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0

      - name: luacheck
        run: luacheck .

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check . .tests

      - name: Flavor isolation
        run: bash .scripts/check-flavor-isolation.sh && bash .tests/isolation_test.sh

      - name: Asset paths
        run: bash .scripts/check-asset-paths.sh && bash .tests/asset_paths_test.sh

      - name: Headless tests (Lua 5.1)
        run: lua5.1 .tests/run.lua
