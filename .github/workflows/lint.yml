name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: luacheck
        run: luacheck .

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check . .tests

      - name: Flavor isolation
        run: bash .scripts/check-flavor-isolation.sh && bash .tests/isolation_test.sh

      - name: Headless tests (Lua 5.1)
        run: lua5.1 .tests/run.lua
