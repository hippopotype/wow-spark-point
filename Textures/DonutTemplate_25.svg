<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steel gradient (tweak these stops to match WoW UI) -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa2aa" stop-opacity="1"/>
      <stop offset="35%" stop-color="#6f7780" stop-opacity="1"/>
      <stop offset="65%" stop-color="#3f444a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2a2e33" stop-opacity="1"/>
    </linearGradient>

    <!-- Subtle inner highlight gradient -->
    <linearGradient id="innerHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 0.92  0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1.5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.45" result="shadow"/>
      <feComposite operator="in" in="shadow" in2="inverse" result="shadow-in"/>
      <feComposite operator="over" in="shadow-in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Ring parameters: center 128,128; radius 96.00; thickness 25 -->
  <circle cx="128" cy="128" r="96.00" fill="none" stroke="url(#steel)" stroke-width="25" filter="url(#outerGlow)"/>
  <circle cx="128" cy="128" r="96.00" fill="none" stroke="url(#innerHighlight)" stroke-width="9"/>
  <circle cx="128" cy="128" r="96.00" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="25" filter="url(#innerShadow)"/>
</svg>
